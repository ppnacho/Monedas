<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección Privada - Gestión Numista</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabecera -->
        <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h1>Colección Privada</h1>
                <p>Monedas y piezas guardadas en tu base de datos local</p>
            </div>
            <div>
                <a href="index.html" class="btn-primary" style="text-decoration: none; padding: 8px 16px; background-color: #6c757d; display: inline-block;">Volver al Buscador</a>
            </div>
        </header>

        <!-- Filtros de la Colección Privada -->
        <main>
            <section class="search-card">
                <form id="filterFormPrivada">
                    <div class="form-grid">
                        <!-- Búsqueda por texto (Título) -->
                        <div class="form-group">
                            <label for="qPrivada">Descripción (Título):</label>
                            <input type="text" id="qPrivada" placeholder="Ej. 2 Euros, Alfonso XII...">
                        </div>

                        <!-- Emisor / País -->
                        <div class="form-group" style="position: relative;">
                            <label for="issuerPrivadaInput">País / Emisor:</label>
                            <input type="text" id="issuerPrivadaInput" placeholder="Escribe o selecciona país..." autocomplete="off">
                            <input type="hidden" id="issuerPrivada">
                            <div id="listaEmisoresPrivada" class="hidden"></div>
                        </div>

                        <!-- Año -->
                        <div class="form-group">
                            <label for="yearPrivada">Año:</label>
                            <input type="text" id="yearPrivada" placeholder="Ej. 2023, -2000, 2000-, 1500-1600">
                        </div>
                    </div>

                    <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                        <button type="button" id="btnResetPrivada" class="btn-secondary" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Limpiar filtros</button>
                        <button type="submit" class="btn-primary">Filtrar colección</button>
                    </div>
                </form>
            </section>

            <!-- Contenedor de Estado / Carga -->
            <div id="loadingPrivada" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Cargando tu colección privada...</p>
            </div>

            <!-- Contenedor de Resultados -->
            <section id="resultsPrivada" class="results-grid">
                <!-- Las piezas guardadas se inyectarán aquí dinámicamente -->
            </section>
        </main>
    </div>

    <!-- Script Principal de la Colección Privada -->
    <script type="module" src="assets/js/col_privada.js"></script>
</body>
</html>
