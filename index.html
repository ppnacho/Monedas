<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Monedas - Numista</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Catálogo Numista - Buscador</h1>
        
        <!-- Filtros de Búsqueda -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="query" placeholder="Ej. 2 Euros, Peseta..." class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="country" placeholder="Código País (ej. es, us)..." class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="search-btn" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition-colors">Buscar en Numista</button>
        </div>

        <!-- Resultados -->
        <div id="loading" class="hidden text-center text-gray-500 py-4">Buscando monedas...</div>
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Script principal de la aplicación -->
    <script src="assets/js/index.js"></script>
</body>
</html>
