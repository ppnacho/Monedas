<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Monedas - Numista</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Catálogo Numista - Buscador</h1>
        
        <!-- Filtros de Búsqueda -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="query" placeholder="Ej. 2 Euros, Peseta..." class="border p-2 rounded">
            <input type="text" id="country" placeholder="Código País (ej. es, us)..." class="border p-2 rounded">
            <button onclick="buscarMonedas()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Buscar en Numista</button>
        </div>

        <!-- Resultados -->
        <div id="loading" class="hidden text-center text-gray-500 py-4">Buscando monedas...</div>
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        // Configura tus credenciales públicas de Supabase
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function buscarMonedas() {
            const query = document.getElementById('query').value;
            const country = document.getElementById('country').value;
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            loading.classList.remove('hidden');
            resultsDiv.innerHTML = '';

            try {
                // Llamada a la Edge Function de Supabase
                const { data, error } = await supabaseClient.functions.invoke('numista-proxy', {
                    body: {
                        endpoint: 'coins/search',
                        params: { q: query, country: country }
                    }
                });

                if (error) throw error;

                loading.classList.add('hidden');
                
                if (!data || data.length === 0) {
                    resultsDiv.innerHTML = '<p class="text-gray-500 col-span-2">No se encontraron monedas.</p>';
                    return;
                }

                // Renderizar resultados (Numista suele devolver una lista de fichas)
                data.forEach(coin => {
                    const card = document.createElement('div');
                    card.className = 'border p-4 rounded-lg flex gap-4 items-center bg-gray-50';
                    card.innerHTML = `
                        <div class="flex-1">
                            <h3 class="font-bold text-lg text-blue-900">${coin.title || 'Sin título'}</h3>
                            <p class="text-sm text-gray-600">Emisor: ${coin.issuer?.name || 'Desconocido'}</p>
                            <p class="text-xs text-gray-500 mt-1">ID Numista: N#${coin.id}</p>
                            <button onclick="agregarAMiColeccion('${coin.id}')" class="mt-3 bg-green-600 text-white text-xs px-3 py-1.5 rounded hover:bg-green-700">Añadir a mi colección</button>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                loading.classList.add('hidden');
                alert('Error al buscar: ' + err.message);
            }
        }

        function agregarAMiColeccion(numistaId) {
            alert(`Aquí guardarás la moneda N#${numistaId} en tu tabla user_collection de Supabase.`);
            // Aquí implementarías el insert hacia tu base de datos de Supabase.
        }
    </script>
</body>
</html>
