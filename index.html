<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Colección Numista</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabecera -->
        <header class="app-header">
            <h1>Gestión de Colección Numista</h1>
            <p>Busca, filtra y gestiona tus piezas de colección</p>
        </header>

        <!-- Formulario de Búsqueda y Filtros -->
        <main>
            <section class="search-card">
                <form id="searchForm">
                    <div class="form-grid">
                        <!-- Búsqueda por texto -->
                        <div class="form-group">
                            <label for="q">Buscar término:</label>
                            <input type="text" id="q" placeholder="Ej. 2 Euros, Alfonso XII...">
                        </div>

                        <!-- Emisor / País -->
                        <div class="form-group">
                            <label for="issuer">País / Emisor:</label>
                            <select id="issuer">
                                <option value="">-- Todos los emisores --</option>
                            </select>
                        </div>

                        <!-- Categoría -->
                        <div class="form-group">
                            <label for="category">Categoría:</label>
                            <select id="category">
                                <option value="">-- Todas las categorías --</option>
                            </select>
                        </div>

                        <!-- Subcategoría de Medalla (Dinámica) -->
                        <div class="form-group" id="medal-container" style="display: none;">
                            <label for="medal_type">Tipo de Medalla:</label>
                            <select id="medal_type">
                                <option value="">-- Todos los tipos de medallas --</option>
                            </select>
                        </div>

                        <!-- Año -->
                        <div class="form-group">
                            <label for="year">Año:</label>
                            <input type="text" id="year" placeholder="Ej. 2023, 1999">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Buscar piezas</button>
                    </div>
                </form>
            </section>

            <!-- Contenedor de Estado / Carga -->
            <div id="loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Buscando en el catálogo de Numista...</p>
            </div>

            <!-- Contenedor de Resultados -->
            <section id="results" class="results-grid">
                <!-- Las tarjetas de monedas se inyectarán aquí dinámicamente -->
            </section>
        </main>
    </div>

    <!-- Script Principal -->
    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
