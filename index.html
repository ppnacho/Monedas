<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Colección Numismatica</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/jpeg" href="assets/img/coleccion_monedas.jpeg">
    <link rel="apple-touch-icon" sizes="1024x1024" href="assets/img/coleccion_monedas.jpeg">
</head>
<body>
    <div class="app-container">
        <!-- Cabecera -->
        <header class="app-header">
            <h1>Gestión de Colección Numista</h1>
            <p>Busca, filtra y gestiona tus piezas de colección</p>
        </header>

        <!-- Formulario de Búsqueda y Filtros -->
        <main>
            <section class="search-card">
                <form id="searchForm">
                    <div class="form-grid">
                        <!-- Búsqueda por texto -->
                        <div class="form-group">
                            <label for="q">Buscar término:</label>
                            <input type="text" id="q" placeholder="Ej. 2 Euros, Alfonso XII...">
                        </div>

                        <!-- Emisor / País (Autocompletado personalizado móvil/PC) -->
                        <div class="form-group" style="position: relative;">
                            <label for="issuer-input">País / Emisor:</label>
                            <input type="text" id="issuer-input" placeholder="Escribe para buscar país..." autocomplete="off">
                            
                            <!-- Contenedor flotante para las sugerencias -->
                            <div id="lista-emisores" class="custom-suggestions-dropdown hidden"></div>

                            <!-- Campo oculto para mantener la compatibilidad con tu lógica de búsqueda -->
                            <input type="hidden" id="issuer" name="issuer">
                        </div>

                        <!-- Categoría -->
                        <div class="form-group">
                            <label for="category">Categoría:</label>
                            <select id="category">
                                <option value="">-- Todas las categorías --</option>
                            </select>
                        </div>

                        <!-- Subcategoría / Subtipo (Dinámica) -->
                        <div class="form-group" id="subtype-container">
                            <label for="object_type">Tipo de Pieza:</label>
                            <select id="object_type">
                                <option value="">-- Todos los tipos --</option>
                            </select>
                        </div>

                        <!-- Año -->
                        <div class="form-group">
                            <label for="year">Año:</label>
                            <input type="text" id="year" placeholder="Ej. 2023, -2000, 2000-, 1500-1600">
                        </div>
                    </div>

                    <div class="form-actions" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <button type="button" id="btnColeccionPrivada" class="btn-secondary" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">Colección Privada</button>
                        <button type="submit" class="btn-primary">Buscar piezas</button>
                    </div>
                </form>
            </section>

            <!-- Contenedor de Estado / Carga -->
            <div id="loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Buscando en el catálogo de Numista...</p>
            </div>

            <!-- Contenedor de Resultados -->
            <section id="results" class="results-grid">
                <!-- Las tarjetas de monedas se inyectarán aquí dinámicamente -->
            </section>
        </main>
    </div>

    <!-- Script Principal -->
    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
